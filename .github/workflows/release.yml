name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default. The one job that needs to publish asks for write
# itself, so a future job added to this file does not inherit the token that
# can rewrite releases.
permissions:
  contents: read

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Actions are pinned by commit SHA, not by tag. A tag like @v4 points at
      # whatever commit its owner last moved it to, so a compromised action —
      # or a compromised maintainer account — would run arbitrary code here
      # with a GITHUB_TOKEN that can publish releases. The version comment is
      # for humans; the SHA is what runs.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"

      # The release body used to be a list of commit subjects with 40-character
      # SHAs, generated from git log. CHANGELOG.md was written by hand and read
      # by nothing, so it drifted: v0.11.0 through v0.12.1 all shipped while the
      # file still filed their entries under "Unreleased".
      #
      # Now the changelog is the source, and a missing section stops the
      # release. --release-notes bypasses release.header and release.footer
      # entirely (goreleaser v2.17.1, internal/pipe/changelog), so the whole
      # body is composed here.
      - name: Compose release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          NOTES="${RUNNER_TEMP}/release-notes.md"

          awk -v v="$V" '
            BEGIN                 { start = "## [" v "]" }
                                  { sub(/\r$/, "") }
            index($0, start) == 1 { p = 1; next }
            p && /^## \[/         { exit }
            p                     { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/section.md"

          if [ ! -s "${RUNNER_TEMP}/section.md" ]; then
            echo "::error file=CHANGELOG.md::No '## [${V}]' section — refusing to release ${TAG} with notes nobody wrote"
            exit 1
          fi

          sed "s/\$TAG/${TAG}/g" .github/release-notes-header.md > "$NOTES"
          cat "${RUNNER_TEMP}/section.md" >> "$NOTES"
          echo "Release notes for ${TAG}:"
          cat "$NOTES"

      # The README's download commands are copied by hand and went stale: they
      # advertised v0.10.0 while v0.12.1 was current, so the documented install
      # was two minor versions behind the one being announced. Same rule as the
      # changelog — the docs describe this release before it ships.
      - name: README must advertise the release being published
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          V="${TAG#v}"

          stale="$(grep -oE 'releases/download/v[0-9]+\.[0-9]+\.[0-9]+/[^ )]+' README.md \
            | grep -v "^releases/download/${TAG}/graymatter_${V}_" || true)"
          if [ -n "$stale" ]; then
            echo "::error file=README.md::download links do not point at ${TAG}:"
            echo "$stale"
            exit 1
          fi

          if ! grep -qE "^\*GrayMatter .* ${TAG} " README.md; then
            echo "::error file=README.md::the footer does not name ${TAG}"
            exit 1
          fi

      # cmd/graymatter is its own module, so Go resolves its versions from tags
      # prefixed with the module path. Without them the CLI had no published
      # version at all: `@vX.Y.Z` failed with "unknown revision", and `@latest`
      # — the command printed on every release page — resolved to a
      # pseudo-version of whatever was on main, not to the release being read.
      #
      # Pushed after the changelog gate so a release that is going to fail does
      # not leave a version behind on the Go proxy, which never forgets one.
      # The tag does not start with "v", so it cannot re-trigger this workflow.
      # Homebrew, Scoop and Nix push into three repositories this job's
      # GITHUB_TOKEN cannot reach. Checked here, before anything is published,
      # so a missing credential costs a re-run instead of leaving a half-done
      # release behind.
      - name: Package-manager taps need their own credential
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "${TAP_GITHUB_TOKEN}" ]; then
            echo "::error::TAP_GITHUB_TOKEN is not set. GoReleaser publishes to angelnicolasc/homebrew-tap, /scoop-bucket and /nur-packages, which the default GITHUB_TOKEN cannot write to. Add a PAT with 'repo' scope as the TAP_GITHUB_TOKEN secret, or drop the brews/scoops/nix sections from .goreleaser.yml."
            exit 1
          fi

      # v0.13.0 published this tag and then failed in GoReleaser on a malformed
      # brews block. The retry died here instead, on `tag already exists`, and
      # the release could not be completed without hand surgery. The tag is
      # immutable once the Go proxy has served it, so a re-run must accept the
      # one already published rather than try to recreate it.
      - name: Publish the CLI submodule tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin "refs/tags/cmd/graymatter/${TAG}" >/dev/null 2>&1; then
            echo "cmd/graymatter/${TAG} is already published; leaving it untouched"
          else
            git tag "cmd/graymatter/${TAG}" "${TAG}"
            git push origin "cmd/graymatter/${TAG}"
          fi

      # GoReleaser builds with the workspace disabled, so the CLI module
      # resolves the root library from the module proxy — which has not
      # indexed the tag being released yet (0s-old tags 404 on the checksum
      # database; verified twice on the v0.16.0 and v0.16.1 tags). The
      # canonical pre-gomod.proxy workaround: a replace directive that exists
      # only inside this job's checkout, resolving the library to the very
      # checkout the tag points at. Reverted right after the build; the
      # published go.mod stays replace-free (issue #75).
      - name: Temporary checkout replace for the sandboxed build
        run: go mod edit -replace github.com/angelnicolasc/graymatter=../..
        working-directory: cmd/graymatter

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          # Pinned, not "latest": the released binaries are built by whatever
          # this resolves to, so it should not change without a commit.
          version: v2.17.1
          # --skip=validate: the temporary replace above dirties the tree by
          # design; HEAD is still the release tag, so the version stamping is
          # untouched and only the validator is relaxed.
          args: release --clean --skip=validate --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only the tap publishers read this; the release itself stays on the
          # repository-scoped token.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Revert the temporary replace
        if: always()
        run: git checkout -- cmd/graymatter/go.mod cmd/graymatter/go.sum

  # The README's first install path is `go install ...@vX.Y.Z`, and it failed
  # silently for four releases: a replace directive in cmd/graymatter/go.mod
  # made every tagged version uninstallable that way while binary downloads
  # kept working (issue #75). The fix landed in the same commit as this gate:
  # from now on, a release is not done until the exact tag being published
  # installs through the module machinery a fresh user would use.
  #
  # This gate used to run GOPROXY=direct, which is precisely not the machinery
  # a fresh user would use, and the gap showed on v0.18.0: the job went green
  # while `go install …/cmd/graymatter@v0.18.0` — the README's own first
  # command — failed for every user with a 404 from sum.golang.org. The
  # submodule had been indexed; the root library it requires had not, and the
  # checksum lookup for a transitive dependency aborts the whole install.
  #
  # The earlier reasoning held that the proxy's catch-up is a property of the
  # CDN and that a retry loop would trade determinism for waiting. Half of
  # that is right: it is the CDN's timing. What it misses is that the delay is
  # not only something to wait out — proxy.golang.org fetches a version the
  # first time it is asked for one, so a request is what starts the clock. The
  # warm step below asks, then polls the checksum database until it answers,
  # and only then does the install run the unadorned command. The wait is
  # bounded and it is waiting on a condition this workflow itself triggered,
  # which is a different thing from waiting on a CDN and hoping.
  install-smoke:
    name: go install at the released tag
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"

      # Both modules are warmed, not just the CLI: `go install` of the CLI
      # resolves the root library as a require, and it is the library's
      # checksum lookup that 404s and takes the install down with it.
      - name: Warm the public proxy and wait for the checksum database
        env:
          TAG: ${{ github.ref_name }}
          WARM_ATTEMPTS: "60"
          WARM_INTERVAL: "10"
        run: |
          set -euo pipefail
          LIB="github.com/angelnicolasc/graymatter"
          CLI="${LIB}/cmd/graymatter"

          # The request is the trigger. The sumdb is bypassed here on purpose:
          # populating it is the whole point of the step. Retried because a tag
          # pushed seconds ago can 404 while GitHub is still replicating it,
          # which is a race worth losing a few times, not a release failure.
          for mod in "${LIB}" "${CLI}"; do
            warmed=""
            for attempt in $(seq 1 "${WARM_ATTEMPTS}"); do
              if GOFLAGS= GOWORK=off GOPROXY=https://proxy.golang.org \
                 GONOSUMDB="github.com/angelnicolasc/*" go list -m "${mod}@${TAG}"; then
                warmed="yes"; break
              fi
              printf '  proxy has not served %s@%s yet (attempt %s/%s)\n' \
                "${mod}" "${TAG}" "${attempt}" "${WARM_ATTEMPTS}"
              sleep "${WARM_INTERVAL}"
            done
            if [ -z "${warmed}" ]; then
              echo "::error::proxy.golang.org never served ${mod}@${TAG}"
              exit 1
            fi
          done

          # Then prove it rather than trust it: the install below consults
          # exactly this endpoint, so it is the gate's precondition, checked.
          for mod in "${LIB}" "${CLI}"; do
            served=""
            for attempt in $(seq 1 "${WARM_ATTEMPTS}"); do
              code="$(curl -sS -o /dev/null -w '%{http_code}' \
                "https://sum.golang.org/lookup/${mod}@${TAG}" || echo "000")"
              if [ "${code}" = "200" ]; then served="yes"; break; fi
              printf '  %s@%s -> %s (attempt %s/%s)\n' \
                "${mod}" "${TAG}" "${code}" "${attempt}" "${WARM_ATTEMPTS}"
              sleep "${WARM_INTERVAL}"
            done
            if [ -z "${served}" ]; then
              echo "::error::${mod}@${TAG} is absent from sum.golang.org, so the README's go install fails for every user until it lands"
              exit 1
            fi
            echo "  ${mod}@${TAG} is served by the checksum database"
          done

      - name: Install and run the released binary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          MOD="github.com/angelnicolasc/graymatter/cmd/graymatter@${TAG}"
          # No flags. This is the README's command, character for character,
          # against the default proxy and the real checksum database — the
          # only version of this check that can catch what v0.18.0 shipped.
          go install "${MOD}"
          INSTALLED="$(go env GOPATH)/bin/graymatter"
          # --help is the only guaranteed side-effect-free invocation: it
          # exercises cobra's command graph end to end without touching disk.
          "${INSTALLED}" --help > /dev/null
          echo "${TAG} installs and runs via go install"
