version: 2

project_name: graymatter

before:
  hooks:
    - go mod tidy

builds:
  - id: graymatter
    main: ./cmd/graymatter
    binary: graymatter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

brews:
  - repository:
      owner: angelnicolasc
      name: homebrew-tap
    directory: Formula
    homepage: https://github.com/angelnicolasc/graymatter
    description: "Persistent memory for AI agents. Single binary, zero infrastructure."
    license: MIT
    skip_upload: auto

scoops:
  - repository:
      owner: angelnicolasc
      name: scoop-bucket
    homepage: https://github.com/angelnicolasc/graymatter
    description: "Persistent memory for AI agents. Single binary, zero infrastructure."
    license: MIT

nix:
  - repository:
      owner: angelnicolasc
      name: nur-packages
    homepage: https://github.com/angelnicolasc/graymatter
    description: "Persistent memory for AI agents. Single binary, zero infrastructure."
    license: mit

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: angelnicolasc
    name: graymatter
  draft: false
  prerelease: auto
  name_template: "GrayMatter {{.Tag}}"
